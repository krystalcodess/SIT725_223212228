services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/kfz-legal
      RAG_MONGODB_URI: mongodb://mongo:27017/kfz-legal-rag
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads_data:/app/server/uploads

volumes:
  mongo_data:
  uploads_data:
